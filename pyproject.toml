[project]
name = "mapovac"
version = "0.1.0"
description = "Generátor OB map (ISOM 2017) pro ČR z LiDAR + vektorových dat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "lxml>=5.3",
    "python-multipart>=0.0.12",
    "Pillow>=10.4",
    "laspy[lazrs]>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"
